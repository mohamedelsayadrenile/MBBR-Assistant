[project]
name = "mbbr-assistant"
version = "0.1.0"
description = "Voice chatbot MVP for the MBBR wastewater platform: ASR to agent to MBBR APIs to TTS."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.14.1",
    "redis>=8.0.0",
    "httpx>=0.28.1",
    "transformers>=5.10.2",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "soundfile>=0.14.0",
    "librosa>=0.11.0",
    "accelerate>=1.14.0",
    "voicetut-tts>=0.1.1",
    # voicetut-tts imports omnivoice at load time but does not declare it.
    "omnivoice>=0.1.5",
    "langgraph>=1.2.11",
    "langchain-openai>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "streamlit>=1.41",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
